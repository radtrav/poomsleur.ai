[project]
name = "poomsleur"
version = "0.1.0"
authors = [{ name = "radtrav", email = "travyoung.dev@gmail.com" }]
description = "Poomsleur"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["TTS", "Speech"]
license = "Apache-2.0"
classifiers = ["Programming Language :: Python :: 3"]
dependencies = [
  "numpy<=1.26.4",
  "transformers>=4.45.2",
  "hydra-core>=1.3.2",
  "natsort>=8.4.0",
  "einops>=0.7.0",
  "librosa>=0.10.1",
  "uvicorn>=0.30.0",
  "loguru>=0.6.0",
  "loralib>=0.1.2",
  "pyrootutils>=1.0.4",
  "tiktoken>=0.8.0",
  "pydantic==2.9.2",
  "cachetools",
  "descript-audio-codec",
  "descript-audiotools",
  "fastapi>=0.116.1",
  "soundfile>=0.13.1",
  "pydantic-settings",
]

[project.optional-dependencies]
stable = ["torch<2.9.0", "torchaudio"]
cpu = ["torch>=2.5.1", "torchaudio"]
cu126 = ["torch>=2.5.1", "torchaudio"]
cu128 = ["torch>=2.5.1", "torchaudio"]
cu129 = ["torch>=2.5.1", "torchaudio"]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "cu129" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu129", extra = "cu129" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu129", extra = "cu129" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true


[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fish_speech"]
